[package]
name = "x-wing"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "X-Wing hybrid post-quantum KEM (draft-connolly-cfrg-xwing-kem-11)"
license = "MIT"

[features]
hazmat = []

[dependencies]
ml-kem = { version = "0.3.4", features = ["hazmat", "zeroize"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
sha3 = { version = "0.12.0", default-features = false, features = ["zeroize"] }
shake = { version = "0.1.0", default-features = false, features = ["zeroize"] }
getrandom = { version = "0.4.3", features = ["sys_rng"] }
rand_core = "0.10.1"
subtle = "2.6.1"
thiserror = "2.0.21"
zeroize = { version = "1.9.2", features = ["derive"] }

[dev-dependencies]
hex-literal = "1.1.0"
x-wing-ref = { package = "x-wing", version = "0.1.1" }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
